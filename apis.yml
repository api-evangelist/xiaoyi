name: xiaoyi
description: >-
  Xiaoyi Technology (小蚁科技), operated by Shanghai Yunyi Zhilian Technology
  (上海云蚁智联) and best known for its YI-brand cameras, is a Shanghai-based
  smart-imaging company that emerged from the Xiaomi ecosystem. It builds
  action cameras, the M1 mirrorless camera, smart home/security cameras, dash
  cams and in-car rearview systems, VR cameras, and handheld gimbals, and now
  positions itself around computer vision, edge intelligence, and edge
  computing solutions for smart mobility, smart home, smart retail, smart
  parks, and smart communities, selling through JD and Tmall storefronts.
  Surfaced as a Qiming Venture Partners portfolio company. No public developer
  API surface was found during enrichment - the developer subdomain
  (dev.xiaoyi.com) returns 502, api.xiaoyi.com serves only a placeholder page,
  and no API documentation, OpenAPI specs, official GitHub organization, or
  first-party registry packages were located.
